[project]
name = "models3d-ai"
version = "0.1.0"
description = "Pipeline CLI + Web UI Meshy + Claude per generare modelli 3D print-ready da idea testuale"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "pillow>=10",
    "trimesh[easy]>=4",
    "pymeshfix>=0.17",
    "pymeshlab>=2023.12",
    "lxml>=5",
    "networkx>=3",
    "fast-simplification>=0.1",
    "scipy>=1.13",
    "shapely>=2",
    "rtree>=1.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.12",
]

[project.scripts]
models3d = "src.main:main"
models3d-web = "src.web.app:run"

[dependency-groups]
dev = [
    "ruff>=0.7",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
